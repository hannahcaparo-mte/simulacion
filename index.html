<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Pendientes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --orange:#F97316;--orange-light:#FFF7ED;--orange-mid:#FDBA74;
  --navy:#1E3A5F;--navy-light:#EEF3FA;--navy-mid:#2D5F9E;
  --white:#fff;--gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;
  --gray-400:#94A3B8;--gray-600:#475569;--gray-800:#1E293B;
  --success:#16A34A;--success-bg:#F0FDF4;
  --warn:#D97706;--warn-bg:#FFFBEB;
  --danger:#DC2626;--danger-bg:#FEF2F2;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.07);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-50);min-height:100vh;}

/* TOPBAR */
.topbar{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:36px;height:36px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;}
.logo-text{color:#fff;font-size:15px;font-weight:600;display:none;}
@media(min-width:500px){.logo-text{display:block;}}
.nav-tabs{display:flex;gap:4px;margin-left:12px;}
.nav-tab{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500;background:transparent;color:rgba(255,255,255,.6);transition:all .15s;}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-tab.active{background:var(--orange);color:#fff;}
.user-badge{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.85);font-size:12px;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.avatar.navy{background:var(--navy-mid);}

/* CONTENT */
.content{padding:20px;max-width:980px;margin:0 auto;}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:var(--gray-400);}
.spinner{width:32px;height:32px;border:3px solid var(--gray-200);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
@media(min-width:600px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
.stat{background:#fff;border:0.5px solid var(--gray-200);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
.stat-label{font-size:10px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.stat-val{font-size:24px;font-weight:700;color:var(--navy);}
.stat-val.orange{color:var(--orange);}
.stat-val.green{color:var(--success);}
.stat-val.red{color:var(--danger);}

/* ALERTS */
.alert{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:10px;}
.alert.danger{background:var(--danger-bg);border:1px solid #FCA5A5;color:var(--danger);}
.alert.warn{background:var(--warn-bg);border:1px solid #FDE68A;color:var(--warn);}

/* CARD */
.card{background:#fff;border:0.5px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy);color:#fff;}
.card-header h3{font-size:13px;font-weight:600;}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--gray-50);}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--gray-200);white-space:nowrap;}
td{padding:9px 10px;border-bottom:0.5px solid var(--gray-100);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.done-row td{opacity:.5;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.badge.pending{background:var(--warn-bg);color:var(--warn);}
.badge.progress{background:var(--navy-light);color:var(--navy);}
.badge.done{background:var(--success-bg);color:var(--success);}
.topic-tag{background:var(--navy-light);color:var(--navy);padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600;}
.area-tag{font-size:11px;color:var(--gray-600);}
.by-tag{font-size:10px;color:var(--gray-400);margin-top:2px;}
.support-tag{font-size:10px;color:var(--orange);margin-top:2px;}

/* PROGRESS */
.prog-wrap{background:var(--gray-100);border-radius:3px;height:5px;width:70px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.prog-pct{font-size:10px;color:var(--gray-400);margin-top:2px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.82;}
.btn.primary{background:var(--orange);color:#fff;}
.btn.secondary{background:var(--navy-light);color:var(--navy);}
.btn.danger{background:var(--danger-bg);color:var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--gray-200);color:var(--gray-600);}
.btn.note-btn{background:var(--warn-bg);color:var(--warn);border:1px solid #FDE68A;}
.btn-row{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}

/* SELECT */
.sel{font-size:11px;border:0.5px solid var(--gray-200);border-radius:5px;padding:4px 5px;background:#fff;color:var(--gray-800);cursor:pointer;}

/* DATE */
.date-ok{color:var(--gray-600);}
.date-soon{color:var(--warn);font-weight:600;}
.date-overdue{color:var(--danger);font-weight:600;}

/* PROJECTS */
.proj-card{background:#fff;border:0.5px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.proj-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;border-left:4px solid var(--orange);}
.proj-head:hover{background:var(--gray-50);}
.proj-title{font-size:13px;font-weight:600;color:var(--navy);}
.proj-meta{font-size:10px;color:var(--gray-400);margin-top:2px;}
.proj-right{display:flex;align-items:center;gap:12px;}
.proj-pct{font-size:18px;font-weight:700;color:var(--orange);}
.proj-bar-wrap{width:80px;background:var(--gray-100);border-radius:4px;height:7px;overflow:hidden;}
.proj-bar{height:100%;border-radius:4px;transition:width .4s;}
.chevron{font-size:16px;color:var(--gray-400);transition:transform .2s;line-height:1;}
.chevron.open{transform:rotate(90deg);}
.phases-body{padding:0 16px 12px;border-top:1px solid var(--gray-100);}
.phase-hdr,.phase-row{display:grid;grid-template-columns:26px 1fr 130px 100px 105px;gap:6px;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--gray-100);font-size:12px;}
.phase-hdr{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-200);padding-top:10px;}
.phase-row:last-child{border-bottom:none;}
.phase-num{width:22px;height:22px;border-radius:50%;background:var(--orange-light);color:var(--orange);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.phase-num.done{background:var(--success-bg);color:var(--success);}

/* NOTE INLINE */
.note-inline{margin-top:6px;background:var(--warn-bg);border:1px solid #FDE68A;border-radius:6px;padding:6px 9px;}
.note-inline textarea{width:100%;border:none;background:transparent;font-size:11px;color:var(--gray-800);resize:none;min-height:44px;outline:none;font-family:inherit;line-height:1.5;}
.note-save-btn{font-size:10px;margin-top:4px;}

/* NOTE INDICATOR */
.note-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle;}

/* WORKERS GRID */
.workers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
@media(max-width:500px){.workers-grid{grid-template-columns:1fr;}}
.worker-card{background:#fff;border:0.5px solid var(--gray-200);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);}
.worker-card:hover{border-color:var(--orange);box-shadow:0 4px 12px rgba(249,115,22,.12);}
.worker-info{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.worker-meta{display:flex;gap:12px;font-size:11px;color:var(--gray-600);flex-wrap:wrap;}

/* WORKER TABS */
.wtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.wtab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--gray-200);background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:var(--gray-600);transition:all .15s;}
.wtab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.wtab:hover:not(.active){border-color:var(--orange);color:var(--orange);}

/* SECTION */
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.sec-title{font-size:10px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:1px;}
.empty{padding:24px;text-align:center;color:var(--gray-400);font-size:12px;}

/* COMPLETED TOGGLE */
.toggle-comp{background:none;border:1px solid var(--gray-200);border-radius:7px;padding:6px 12px;font-size:11px;color:var(--gray-600);cursor:pointer;margin-top:10px;}
.toggle-comp:hover{border-color:var(--gray-400);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,50,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.close-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--gray-400);line-height:1;padding:0;}
.form-row{margin-bottom:12px;}
.form-label{font-size:11px;font-weight:700;color:var(--gray-600);margin-bottom:4px;display:block;}
.form-input{width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:7px;font-size:13px;color:var(--gray-800);outline:none;transition:border-color .15s;font-family:inherit;}
.form-input:focus{border-color:var(--navy-mid);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.submit-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s;}
.submit-btn:hover{opacity:.85;}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;border-left:4px solid var(--orange);z-index:300;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* LOGIN */
.login-wrap{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:16px;padding:30px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-logo{width:52px;height:52px;background:var(--navy);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:20px;margin:0 auto 10px;border-bottom:3px solid var(--orange);}
.login-title{text-align:center;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.login-sub{text-align:center;font-size:11px;color:var(--gray-400);margin-bottom:20px;}
.user-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:10px;background:#fff;cursor:pointer;width:100%;margin-bottom:7px;transition:all .15s;text-align:left;}
.user-btn:hover{border-color:var(--orange);background:var(--orange-light);}
.user-btn-name{font-size:13px;font-weight:600;color:var(--navy);}
.user-btn-role{font-size:10px;color:var(--gray-400);}
</style>
</head>
<body>

<script>
// ══════════════════════════════════════════════════════
//  CONFIGURACIÓN — EDITA AQUÍ
// ══════════════════════════════════════════════════════

// URL de tu Apps Script desplegado como Web App
// Después de publicar en Apps Script, pega la URL aquí
const SCRIPT_URL = "TU_APPS_SCRIPT_URL_AQUI";

/// Usuarios — deben coincidir con los del Codigo.gs
const USERS = {
  admin1: { name:"Maybee",       role:"admin",  initials:"MA" },
  admin2: { name:"Alfredo",      role:"admin",  initials:"AL" },
  admin3: { name:"Tamia",      role:"admin",  initials:"TA" },
  Hannah: { name:"Hannah ",  role:"worker", initials:"HA", area:"User" },
  Krist:  { name:"Krist ",   role:"worker", initials:"KR", area:"User"  },
  Milagros:  { name:"Milagros ", role:"worker", initials:"MI", area:"User" },
  Rosemary:  { name:"Rosemary ", role:"worker", initials:"RO", area:"Comercial" },
  Angela: { name:"Angela ",  role:"worker", initials:"AN", area:"Comercial" },
  Natalia:  { name:"Natalia ",   role:"worker", initials:"NA", area:"Comercial"  },
  Nirvana:  { name:"Nirvana ", role:"worker", initials:"NI", area:"Comercial" },
  Giacomo:  { name:"Giacomo ", role:"worker", initials:"GI", area:"User" },
  Joshnell: { name:"Joshnell ",  role:"worker", initials:"JO", area:"User" },
  Yuri:  { name:"Yuri ",   role:"worker", initials:"YU", area:"User"  },
  Felix:  { name:"Felix ", role:"worker", initials:"FE", area:"User" },
  Alejandro:  { name:"Alejandro ", role:"worker", initials:"AJ", area:"User" },
 Jacqueline:  { name:"Jacqueline ", role:"worker", initials:"JA", area:"User" },
};



// ══════════════════════════════════════════════════════
</script>

<script>
// ── API ───────────────────────────────────────────────
async function api(action, params={}, body=null) {
  // Apps Script blocks CORS preflight on POST with JSON headers.
  // Solution: always use GET, encode body as a single "payload" param.
  const url = new URL(SCRIPT_URL);
  url.searchParams.set("action", action);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  if (body) {
    url.searchParams.set("payload", JSON.stringify({action, ...body}));
  }

  const res  = await fetch(url.toString(), { method:"GET" });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch(e) { throw new Error("Respuesta inválida del servidor: " + text.slice(0,120)); }
  if (!json.ok) throw new Error(json.error || "Error desconocido");
  return json.data;
}

// ── HELPERS ───────────────────────────────────────────
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function formatDate(str) {
  if (!str) return "—";
  const d = new Date(str + "T12:00:00");
  return d.toLocaleDateString("es-PE",{day:"2-digit",month:"short",year:"2-digit"});
}
function dateStatus(str) {
  if (!str) return "ok";
  const diff = Math.round((new Date(str+"T12:00:00") - new Date()) / 86400000);
  if (diff < 0)  return "overdue";
  if (diff <= 1) return "soon";
  return "ok";
}
function dateHtml(str) {
  const s = dateStatus(str);
  if (s==="overdue") return `<span class="date-overdue">⚠️ ${formatDate(str)}</span>`;
  if (s==="soon")    return `<span class="date-soon">🔔 ${formatDate(str)}</span>`;
  return `<span class="date-ok">${formatDate(str)}</span>`;
}
function pct(action) { return action==="done"?100:action==="progress"?50:0; }
function workerOptions(sel="",excludeId=null) {
  return Object.entries(USERS)
    .filter(([id,u]) => u.role==="worker" && id!==excludeId)
    .map(([id,u])=>`<option value="${id}" ${id===sel?"selected":""}>${u.name}</option>`)
    .join("");
}
function allWorkerOptions(sel="") {
  return Object.entries(USERS)
    .filter(([,u]) => u.role==="worker")
    .map(([id,u])=>`<option value="${id}" ${id===sel?"selected":""}>${u.name} · ${u.area}</option>`)
    .join("");
}
function toast(msg) {
  document.querySelectorAll(".toast").forEach(e=>e.remove());
  const el = document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}
function $(id){ return document.getElementById(id); }
function projPct(proj) {
  if (!proj.phases||!proj.phases.length) return 0;
  const done = proj.phases.filter(p=>p.action==="done").length;
  return Math.round((done/proj.phases.length)*100);
}

// ── STATE ─────────────────────────────────────────────
let S = {
  userId: null, user: null,
  tareas:[], proyectos:[], conteos:[],
  activeTab:"tasks", adminView:"overview",
  selectedWorker: null,
  showCompleted: false,
  expandedProjs: {},
  expandedNotes: {},
  modal: null,
  loading: true
};

// ── BOOT ──────────────────────────────────────────────
async function boot() {
  const userId = getParam("user");
  if (!userId || !USERS[userId]) { renderLogin(); return; }
  S.userId = userId;
  S.user   = USERS[userId];
  S.selectedWorker = Object.keys(USERS).find(k=>USERS[k].role==="worker");
  renderLoading();
  await loadData();
  render();
}

async function loadData() {
  try {
    const [tareas, proyectos, conteos] = await Promise.all([
      api("getTareas", { userId: S.userId }),
      api("getProyectos", { userId: S.userId }),
      api("getConteos")
    ]);
    S.tareas    = tareas    || [];
    S.proyectos = proyectos || [];
    S.conteos   = conteos   || [];
    S.loading   = false;
  } catch(e) {
    S.loading = false;
    document.body.innerHTML = `<div style="padding:40px;text-align:center;color:#DC2626;">
      <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
      <div style="font-size:16px;font-weight:600;">Error al cargar datos</div>
      <div style="font-size:13px;color:#666;margin-top:8px;">${e.message}</div>
      <div style="font-size:12px;color:#999;margin-top:8px;">Verifica que la URL del Apps Script esté configurada correctamente.</div>
    </div>`;
  }
}

function renderLoading() {
  document.body.innerHTML = `
    <div style="min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;">
      <div style="text-align:center;color:#fff;">
        <div class="spinner" style="margin:0 auto 14px;border-top-color:#F97316;"></div>
        <div style="font-size:14px;opacity:.7;">Cargando sistema...</div>
      </div>
    </div>`;
}

// ── LOGIN ─────────────────────────────────────────────
function renderLogin() {
  document.body.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">G</div>
        <div class="login-title">Gestión de Pendientes</div>
        <div class="login-sub">Selecciona tu perfil para acceder</div>
        ${Object.entries(USERS).map(([id,u])=>`
          <button class="user-btn" onclick="window.location.search='?user=${id}'">
            <div class="avatar ${u.role==='admin'?'navy':''}">${u.initials}</div>
            <div>
              <div class="user-btn-name">${u.name}</div>
              <div class="user-btn-role">${u.role==='admin'?'👑 Administrador':'👷 '+u.area}</div>
            </div>
          </button>`).join("")}
      </div>
    </div>`;
}

// ── RENDER ────────────────────────────────────────────
function render() {
  const isAdmin = S.user.role === "admin";
  document.body.innerHTML = `
    ${renderTopbar()}
    <div class="content" id="app">
      ${isAdmin ? renderAdmin() : renderWorker()}
    </div>
    ${S.modal ? renderModal() : ""}
  `;
  bindEvents();
  // Load notes textarea content
  document.querySelectorAll("textarea[data-noteid]").forEach(ta => {
    const tarea = S.tareas.find(t=>t.id===ta.dataset.noteid);
    if (tarea) ta.value = tarea.note || "";
  });
}

// ── TOPBAR ────────────────────────────────────────────
function renderTopbar() {
  const isAdmin = S.user.role==="admin";
  return `
    <div class="topbar">
      <div class="logo">
        <div class="logo-icon">G</div>
        <span class="logo-text">Pendientes</span>
        <div class="nav-tabs">
          ${isAdmin ? `
            <button class="nav-tab ${S.adminView==='overview'?'active':''}" onclick="setAdminView('overview')">General</button>
            <button class="nav-tab ${S.adminView==='worker'?'active':''}" onclick="setAdminView('worker')">Equipo</button>
          ` : `
            <button class="nav-tab ${S.activeTab==='tasks'?'active':''}" onclick="setTab('tasks')">Mis tareas</button>
            <button class="nav-tab ${S.activeTab==='projects'?'active':''}" onclick="setTab('projects')">Proyectos</button>
          `}

// ── MODAL ─────────────────────────────────────────────
function openModal(type,id,preAssign) {
  S.modal = {type,id,preAssign};
  render();
}
function closeModal() { S.modal=null; render(); }

function renderModal() {
  const {type,id,preAssign} = S.modal;
  let title="", body="";
  const isAdmin = S.user.role==="admin";

  if (type==="task" || type==="selfTask") {
    const t    = id ? S.tareas.find(x=>x.id===id) : null;
    const isSelf = type==="selfTask";
    title = t?"Editar tarea":"Nueva tarea";
    body = `
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Área</label><input class="form-input" id="f-area" value="${t?.area||""}" placeholder="Ej: Académica"></div>
        <div class="form-row"><label class="form-label">Tema</label><input class="form-input" id="f-topic" value="${t?.topic||""}" placeholder="Ej: Q10"></div>
      </div>
      <div class="form-row"><label class="form-label">Descripción</label><input class="form-input" id="f-desc" value="${t?.desc||""}" placeholder="Describe la tarea..."></div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Fecha límite</label><input class="form-input" type="date" id="f-date" value="${t?.dueDate||""}"></div>
        ${isAdmin&&!isSelf?`
          <div class="form-row"><label class="form-label">Asignado por</label>
            <input class="form-input" value="${S.user.name}" disabled style="background:var(--gray-50);color:var(--gray-400);">
          </div>`:`
          <div class="form-row"><label class="form-label">Asignado por</label>
            <input class="form-input" value="${S.user.name}" disabled style="background:var(--gray-50);color:var(--gray-400);">
          </div>`
        }
      </div>
      ${isAdmin&&!isSelf&&!preAssign?`
        <div class="form-row"><label class="form-label">Asignar a</label>
          <select class="form-input" id="f-assign">${allWorkerOptions(t?.assignedTo||"")}</select>
        </div>`:""}
      <button class="submit-btn" onclick="doSaveTask('${id||""}','${preAssign||""}','${isSelf}')">
        ${t?"Guardar cambios":"Crear tarea 📋"}
      </button>`;
  }

  if (type==="project" || type==="selfProject") {
    const isSelf = type==="selfProject";
    title = "Nuevo proyecto";
    body = `
      <div class="form-row"><label class="form-label">Nombre del proyecto</label><input class="form-input" id="f-pname" placeholder="Ej: Plataforma E-learning"></div>
      <div class="form-grid">
        <div class="form-row"><label class="form-label">Área</label><input class="form-input" id="f-parea" placeholder="Ej: Sistemas"></div>
        <div class="form-row"><label class="form-label">Asignado por</label>
          <input class="form-input" value="${S.user.name}" disabled style="background:var(--gray-50);color:var(--gray-400);">
        </div>
      </div>
      ${isAdmin&&!isSelf&&!preAssign?`
        <div class="form-row"><label class="form-label">Asignar a</label>
          <select class="form-input" id="f-passign">${allWorkerOptions()}</select>
        </div>`:""}
      <button class="submit-btn" onclick="doSaveProject('${preAssign||""}','${isSelf}')">Crear proyecto 📁</button>`;
  }

  if (type==="phase") {
    const [projId,phId] = id.split(":");
    const proj = S.proyectos.find(p=>p.id===projId);
    const ph   = phId!=="new" ? (proj?.phases||[]).find(p=>p.id===phId) : null;
    title = ph?"Editar fase":"Agregar fase";
    body = `
      <div class="form-row"><label class="form-label">Nombre de la fase</label><input class="form-input" id="f-phname" value="${ph?.name||""}" placeholder="Ej: Diseño UX/UI"></div>
      <div class="form-row"><label class="form-label">Descripción</label><input class="form-input" id="f-phdesc" value="${ph?.desc||""}" placeholder="¿Qué incluye esta fase?"></div>
      <div class="form-row"><label class="form-label">Fecha límite</label><input class="form-input" type="date" id="f-phdate" value="${ph?.dueDate||""}"></div>
      <button class="submit-btn" onclick="doSavePhase('${projId}','${phId}')">${ph?"Guardar cambios":"Agregar fase"}</button>`;
  }

  if (type==="support") {
    const t = S.tareas.find(x=>x.id===id);
    title = "Asignar apoyo";
    body = `
      <p style="font-size:12px;color:var(--gray-600);margin-bottom:12px;">Selecciona un compañero para apoyarte. Recibirá una notificación por correo.</p>

      </div>
      <button class="submit-btn" onclick="doSaveSupport('${id}')">Asignar 📧</button>`;
  }

  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title">${title}<button class="close-btn" onclick="closeModal()">✕</button></div>
        ${body}
      </div>
    </div>`;
}

// ── ACTIONS ───────────────────────────────────────────
async function doSaveTask(existingId, preAssign, isSelf) {
  const area   = $("f-area")?.value.trim()||"";
  const topic  = $("f-topic")?.value.trim()||"";
  const desc   = $("f-desc")?.value.trim()||"";
  const dueDate= $("f-date")?.value||"";
  // Determine assignedTo
  let assignedTo;
  if (isSelf==="true") {
    assignedTo = S.userId;
  } else if (preAssign) {
    assignedTo = preAssign;
  } else {
    assignedTo = $("f-assign")?.value || S.userId;
  }
  const assignedBy = S.userId;

  if (!desc||!dueDate) { alert("Completa descripción y fecha."); return; }

  if (existingId) {
    const old = S.tareas.find(t=>t.id===existingId);
    await api("saveTarea",{},{tarea:{...old,area,topic,desc,dueDate,assignedTo,assignedBy}});
    toast("Tarea actualizada.");
  } else {
    await api("saveTarea",{},{tarea:{area,topic,desc,dueDate,assignedTo,assignedBy,note:""}});
    const w = USERS[assignedTo];
    toast(`Tarea creada${assignedTo!==S.userId?" y notificada a "+w?.name:""}.`);
  }
  closeModal();
  await loadData(); render();
}

async function doSaveProject(preAssign, isSelf) {
  const name = $("f-pname")?.value.trim()||"";
  const area = $("f-parea")?.value.trim()||"";
  let assignedTo;
  if (isSelf==="true") assignedTo = S.userId;
  else if (preAssign)  assignedTo = preAssign;
  else assignedTo = $("f-passign")?.value || S.userId;
  const assignedBy = S.userId;

  if (!name||!area) { alert("Completa nombre y área."); return; }
  await api("saveProyecto",{},{proyecto:{name,area,assignedTo,assignedBy,phases:[]}});
  const w = USERS[assignedTo];
  toast(`Proyecto creado${assignedTo!==S.userId?" y notificado a "+w?.name:""}.`);
  closeModal();
  await loadData(); render();
}

async function doSavePhase(projId, phId) {
  const name   = $("f-phname")?.value.trim()||"";
  const desc   = $("f-phdesc")?.value.trim()||"";
  const dueDate= $("f-phdate")?.value||"";
  if (!name||!dueDate) { alert("Completa nombre y fecha."); return; }

  const proj   = S.proyectos.find(p=>p.id===projId);
  if (!proj) return;
  const phases = JSON.parse(JSON.stringify(proj.phases||[]));

  if (phId==="new") {
    phases.push({id:uid(),name,desc,dueDate,action:"pending"});
  } else {
    const idx = phases.findIndex(p=>p.id===phId);
    if (idx>=0) phases[idx]={...phases[idx],name,desc,dueDate};
  }
  await api("saveProyecto",{},{proyecto:{...proj,phases}});
  toast("Fase guardada.");
  closeModal();
  S.expandedProjs[projId]=true;
  await loadData(); render();
}

async function doSaveSupport(taskId) {
  const supportId = $("f-support")?.value||"";
  await api("updateTareaField",{},{id:taskId,field:"support",value:supportId||""});
  if (supportId) {
    const sup = USERS[supportId];
    toast(`Apoyo asignado a ${sup?.name}. Notificación enviada.`);
  } else {
    toast("Apoyo removido.");
  }
  closeModal();
  await loadData(); render();
}

async function doChangeAction(taskId, action) {
  if (action==="done") {
    if (!confirm("¿Marcar como terminada? La tarea se moverá a completadas y se borrará su nota.")) {
      render(); return;
    }
    await api("completeTarea",{},{id:taskId,userId:S.userId});
    toast("✅ Tarea completada. Administradores notificados.");
  } else {
    await api("updateTareaField",{},{id:taskId,field:"action",value:action});
  }
  await loadData(); render();
}

async function doChangePhase(projId, phId, action) {
  await api("updateFase",{},{proyId:projId,faseId:phId,field:"action",value:action});
  if (action==="done") toast("Fase completada. Administradores notificados.");
  S.expandedProjs[projId]=true;
  await loadData(); render();
}

async function doDeleteTask(id) {
  if (!confirm("¿Eliminar esta tarea?")) return;
  await api("deleteTarea",{},{id});
  toast("Tarea eliminada.");
  await loadData(); render();
}

async function doDeleteProject(id) {
  if (!confirm("¿Eliminar este proyecto y todas sus fases?")) return;
  await api("deleteProyecto",{},{id});
  toast("Proyecto eliminado.");
  await loadData(); render();
}

async function saveNote(taskId) {
  const ta = document.querySelector(`textarea[data-noteid="${taskId}"]`);
  if (!ta) return;
  await api("updateTareaField",{},{id:taskId,field:"note",value:ta.value});
  const t = S.tareas.find(x=>x.id===taskId);
  if (t) t.note = ta.value;
  toast("Nota guardada.");
  render();
}

function toggleNote(taskId) {
  S.expandedNotes[taskId] = !S.expandedNotes[taskId];
  render();
}
function toggleProj(id) { S.expandedProjs[id]=!S.expandedProjs[id]; render(); }
function toggleComp()   { S.showCompleted=!S.showCompleted; render(); }
function setTab(t)      { S.activeTab=t; render(); }
function setAdminView(v){ S.adminView=v; render(); }
function selectWorker(id){ S.selectedWorker=id; S.adminView="worker"; render(); }

function bindEvents() {
  window.openModal=openModal; window.closeModal=closeModal;
  window.doSaveTask=doSaveTask; window.doSaveProject=doSaveProject;
  window.doSavePhase=doSavePhase; window.doSaveSupport=doSaveSupport;
  window.doChangeAction=doChangeAction; window.doChangePhase=doChangePhase;
  window.doDeleteTask=doDeleteTask; window.doDeleteProject=doDeleteProject;
  window.saveNote=saveNote; window.toggleNote=toggleNote;
  window.toggleProj=toggleProj; window.toggleComp=toggleComp;
  window.setTab=setTab; window.setAdminView=setAdminView;
  window.selectWorker=selectWorker;
}

boot();
</script>
</body>
</html>
