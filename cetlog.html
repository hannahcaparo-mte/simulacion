<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CETLOG</title>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title" style="color:#534AB7;">📦 CETLOG</div>
    <div class="topbar-sub">Almacén de UNILEVER PERÚ · Límite total: 184 uds</div>
  </div>
  <span id="connStatus" style="font-size:12px;color:#888780;">Conectando...</span>
</div>

<div class="with-panel">
<div class="page">

  <p class="section-title">Mi stock</p>
  <div class="stock-grid" id="stockGrid"></div>
  <div class="total-bar" id="totalBar"></div>
  <div class="alert-banner" id="alertBanner"></div>

  <p class="section-title">Registrar movimiento manual</p>
  <div class="card">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;">
      <div class="field"><label>Tipo</label>
        <select id="mvTipo">
          <option value="orden-pedido">Orden de pedido</option>
          <option value="orden-compra">Orden de compra</option>
        </select>
      </div>
      <div class="field"><label>Producto</label>
        <select id="mvProd"><option>Rojo</option><option>Azul</option><option>Rosado</option><option>Blanco</option><option>Amarillo</option></select>
      </div>
      <div class="field"><label>Cantidad (unidades)</label>
        <input type="number" id="mvCant" min="1" value="8"/>
      </div>
      <div class="field"><label>Contraparte</label>
        <select id="mvContraparte">
          <option value="entrada:UNILEVER_MEX">Recibo de UNILEVER MEX</option>
          <option value="salida:TOTTUS_CD">Despacho a TOTTUS CD</option>
          <option value="salida:YICHANG_CD">Despacho a YICHANG CD</option>
        </select>
      </div>
    </div>
    <button class="btn primary" onclick="registrarMov()">Registrar movimiento</button>
    <div class="alert-banner" id="mvAlert" style="margin-top:10px;margin-bottom:0"></div>
  </div>

  <p class="section-title">Historial de movimientos</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Hora</th><th>Tipo</th><th>Producto</th><th>Cantidad</th><th>Dirección</th><th>Contraparte</th></tr></thead>
      <tbody id="histBody"><tr><td colspan="7" style="text-align:center;padding:2rem;color:#b4b2a9;">Sin movimientos.</td></tr></tbody>
    </table>
  </div>

</div>
</div>

<div class="orders-panel">
  <p class="section-title">Órdenes de pedido recibidas</p>
  <p style="font-size:11px;color:#888780;margin-bottom:12px;">De UNILEVER PERÚ</p>
  <div id="ordersContainer"><p style="font-size:13px;color:#b4b2a9;text-align:center;padding-top:2rem;">Sin órdenes.</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, addDoc, updateDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const CFG = { apiKey:"AIzaSyBPl8fbal3PwpfZuitFVRDGRwuVmhhA6Ww", authDomain:"cadena-de-suministros-1d554.firebaseapp.com", projectId:"cadena-de-suministros-1d554", storageBucket:"cadena-de-suministros-1d554.firebasestorage.app", messagingSenderId:"154153617557", appId:"1:154153617557:web:0a58532b2008c9d09df39c" };
const app = initializeApp(CFG);
const db = getFirestore(app);

const ID = "CETLOG";
const PRODS = ["Rojo","Azul","Rosado","Blanco","Amarillo"];
const INIT = {Rojo:24,Azul:8,Rosado:32,Blanco:24,Amarillo:48};
const LIMIT = 184;
let stock = {...INIT};
let timers = {};

document.getElementById("connStatus").textContent = "✓ Conectado";

(async()=>{
  const s=await getDoc(doc(db,"stocks",ID));
  if(!s.exists()) await setDoc(doc(db,"stocks",ID),INIT);
  else stock=s.data(); renderStock();
})();

onSnapshot(doc(db,"stocks",ID), s=>{if(s.exists()){stock=s.data();renderStock();}});

onSnapshot(query(collection(db,"movimientos"),where("empresa","==",ID),orderBy("timestamp","desc")), s=>{
  const rows=[]; s.forEach(d=>rows.push({id:d.id,...d.data()})); renderHist(rows);
});

onSnapshot(query(collection(db,"pedidos"),where("destino","==",ID),orderBy("timestamp","desc")), s=>{
  const orders=[]; s.forEach(d=>orders.push({id:d.id,...d.data()})); renderOrders(orders);
});

function renderStock() {
  const total=PRODS.reduce((a,p)=>a+(stock[p]||0),0);
  const pct=Math.min(100,Math.round(total/LIMIT*100));
  const isOver=total>=LIMIT;
  const color=isOver?"#E24B4A":pct>=80?"#EF9F27":"#1D9E75";
  document.getElementById("stockGrid").innerHTML=PRODS.map(p=>{
    const v=stock[p]||0;
    const status=v===0?"danger":"ok";
    return `<div class="stock-card ${status!=="ok"?status:""}">
      <div class="product-name">${p}</div>
      <div class="stock-num ${status}">${v}</div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.min(100,Math.round(v/LIMIT*100))}%;background:${status==="ok"?"#1D9E75":"#E24B4A"}"></div></div>
    </div>`;
  }).join("");
  document.getElementById("totalBar").innerHTML=`
    <span class="total-bar-label">Stock total</span>
    <div class="total-bar-track"><div class="total-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <span class="total-bar-num" style="color:${color}">${total} / ${LIMIT} uds${isOver?" ⚠ LÍMITE":""}</span>`;
  const b=document.getElementById("alertBanner");
  if(isOver){b.className="alert-banner error show";b.textContent="⚠ Stock total alcanzó el límite (184 uds). No se puede recibir más.";}
  else b.className="alert-banner";
}

function renderHist(rows) {
  const b=document.getElementById("histBody");
  if(!rows.length){b.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:#b4b2a9;">Sin movimientos.</td></tr>';return;}
  const tipos={"orden-compra":"Orden de compra","orden-pedido":"Orden de pedido"};
  const labels={UNILEVER_MEX:"UNILEVER MEX",TOTTUS_CD:"TOTTUS CD",YICHANG_CD:"YICHANG CD",UNILEVER_PERU:"UNILEVER PERÚ"};
  b.innerHTML=rows.map((r,i)=>{
    const t=r.timestamp?new Date(r.timestamp.toDate()).toLocaleTimeString("es-PE"):"—";
    return `<tr><td style="color:#b4b2a9">${rows.length-i}</td><td style="color:#888780">${t}</td>
      <td><span class="badge ${r.tipo}">${tipos[r.tipo]||r.tipo}</span></td>
      <td>${r.producto}</td>
      <td style="font-weight:500">${r.direccion==="salida"?"-":"+"}${r.cantidad} uds</td>
      <td>${r.direccion==="salida"?"Salida":"Entrada"}</td>
      <td style="color:#888780;font-size:12px">${labels[r.contraparte]||r.contraparte||r.notas||""}</td></tr>`;
  }).join("");
}

function renderOrders(orders) {
  const c=document.getElementById("ordersContainer");
  if(!orders.length){c.innerHTML='<p style="font-size:13px;color:#b4b2a9;text-align:center;padding-top:2rem;">Sin órdenes.</p>';return;}
  c.innerHTML=orders.map(o=>{
    const t=o.timestamp?new Date(o.timestamp.toDate()).toLocaleTimeString("es-PE"):"—";
    const destLabel={TOTTUS_CD:"TOTTUS CD",YICHANG_CD:"YICHANG CD"}[o.destinoFinal]||"—";
    if(o.estado==="completado") return `<div class="order-item completado">
      <div class="order-title">${o.producto} — ${o.cantidad} cj → ${destLabel}</div>
      <div class="order-detail">${t} · <span class="badge completado">Despachado</span></div></div>`;
    if(o.estado==="vencido") return `<div class="order-item vencido">
      <div class="order-title">${o.producto} — ${o.cantidad} cj</div>
      <div class="order-detail"><span class="badge vencido">Tiempo vencido</span></div></div>`;
    if(o.estado==="en-proceso"){
      if(!timers[o.id]) startTimer(o.id,o.acceptedAt);
      return `<div class="order-item en-proceso" id="ord-${o.id}">
        <div class="order-title">${o.producto} — ${o.cantidad} cj → ${destLabel}</div>
        <div class="order-detail">De: UNILEVER PERÚ · <span class="badge orden-pedido">Orden de pedido</span></div>
        <div class="timer" id="tmr-${o.id}">3:00</div>
        <button class="btn success" style="width:100%;margin-top:6px" onclick="despachar('${o.id}','${o.producto}',${o.cantidad},'${o.destinoFinal||""}')">Despachar ✓</button>
      </div>`;
    }
    return `<div class="order-item pendiente" id="ord-${o.id}">
      <div class="order-title">${o.producto} — ${o.cantidad} cj → ${destLabel}</div>
      <div class="order-detail">De: UNILEVER PERÚ · ${t}<br><span class="badge orden-pedido">Orden de pedido</span></div>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn success" style="flex:1" onclick="aceptar('${o.id}')">Aceptar</button>
        <button class="btn danger" style="flex:1" onclick="rechazar('${o.id}')">Rechazar</button>
      </div></div>`;
  }).join("");
}

function startTimer(oid,acceptedAt){
  if(timers[oid]) return;
  const dl=acceptedAt?(acceptedAt.toDate?acceptedAt.toDate().getTime():acceptedAt)+180000:Date.now()+180000;
  timers[oid]=setInterval(async()=>{
    const rem=dl-Date.now(); const el=document.getElementById("tmr-"+oid);
    if(!el){clearInterval(timers[oid]);return;}
    if(rem<=0){
      clearInterval(timers[oid]);el.textContent="¡TIEMPO!";el.className="timer expired";
      await updateDoc(doc(db,"pedidos",oid),{estado:"vencido"});
      await addDoc(collection(db,"penalizaciones"),{empresa:ID,motivo:"Tiempo vencido",detalle:"Orden de pedido no despachada en 3 min",timestamp:serverTimestamp()});
      return;
    }
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    el.textContent=`${m}:${s.toString().padStart(2,"0")}`;el.className="timer"+(rem<60000?" warning":"");
  },500);
}

window.aceptar = async id => await updateDoc(doc(db,"pedidos",id),{estado:"en-proceso",acceptedAt:serverTimestamp()});
window.rechazar = async id => await updateDoc(doc(db,"pedidos",id),{estado:"rechazado"});

window.despachar = async function(id,producto,cajas,destinoFinal){
  const uds=cajas*8;
  if((stock[producto]||0)<uds){alert("Stock insuficiente.");return;}
  const ns={...stock}; ns[producto]-=uds;
  await setDoc(doc(db,"stocks",ID),ns);
  await addDoc(collection(db,"movimientos"),{empresa:ID,tipo:"orden-pedido",producto,cantidad:uds,direccion:"salida",contraparte:destinoFinal,notas:`Despacho a ${destinoFinal}`,timestamp:serverTimestamp()});
  await updateDoc(doc(db,"pedidos",id),{estado:"completado"});
  clearInterval(timers[id]);
};

window.registrarMov = async function(){
  const tipo=document.getElementById("mvTipo").value;
  const prod=document.getElementById("mvProd").value;
  const cant=parseInt(document.getElementById("mvCant").value);
  const contra=document.getElementById("mvContraparte").value;
  const al=document.getElementById("mvAlert");
  if(!cant||cant<1) return;
  const [dir,cp]=contra.split(":");
  const ns={...stock};
  const total=PRODS.reduce((a,p)=>a+(ns[p]||0),0);
  if(dir==="salida"){
    if((ns[prod]||0)<cant){showAlert(al,"Stock insuficiente.",true);return;}
    ns[prod]-=cant;
  } else {
    if(total+cant>LIMIT){
      showAlert(al,`⚠ Supera el límite total de ${LIMIT} uds. Penalización registrada.`,true);
      await addDoc(collection(db,"penalizaciones"),{empresa:ID,motivo:"Stock límite excedido",detalle:`Total superaría ${LIMIT} uds`,timestamp:serverTimestamp()});
      return;
    }
    ns[prod]+=cant;
  }
  await setDoc(doc(db,"stocks",ID),ns);
  await addDoc(collection(db,"movimientos"),{empresa:ID,tipo,producto:prod,cantidad:cant,direccion:dir,contraparte:cp,notas:"",timestamp:serverTimestamp()});
  showAlert(al,`${dir==="salida"?"-":"+"}${cant} uds de ${prod} registrado.`,false);
};

function showAlert(el,msg,err){el.textContent=msg;el.className="alert-banner show"+(err?" error":"");setTimeout(()=>el.className="alert-banner",4000);}
</script>
</body>
</html>
