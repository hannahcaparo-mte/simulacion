<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YICHANG CD</title>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title" style="color:#BA7517;">🏬 YICHANG CD</div>
    <div class="topbar-sub">Distribuidor · Unidades · Límite total: 120 uds</div>
  </div>
  <span id="connStatus" style="font-size:12px;color:#888780;">Conectando...</span>
</div>

<div class="with-panel">
<div class="page">

  <p class="section-title">Mi stock</p>
  <div class="stock-grid" id="stockGrid"></div>
  <div class="total-bar" id="totalBar"></div>
  <div class="alert-banner" id="alertBanner"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('oc')">Orden de compra → UNILEVER PERÚ</button>
    <button class="tab" onclick="switchTab('dt')">Venta a DON TITO</button>
  </div>

  <div class="tab-content active" id="tab-oc">
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
        <div class="field"><label>Producto</label>
          <select id="ocProd"><option>Rojo</option><option>Azul</option><option>Rosado</option><option>Blanco</option><option>Amarillo</option></select>
        </div>
        <div class="field"><label>Cajas a pedir</label><input type="number" id="ocCant" min="1" value="1"/></div>
        <div class="field" style="display:flex;align-items:flex-end;">
          <button class="btn primary" style="width:100%" onclick="enviarOC()">Enviar orden de compra</button>
        </div>
      </div>
      <div class="alert-banner" id="ocAlert" style="margin-top:10px;margin-bottom:0"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-dt">
    <div class="card">
      <div class="info-box" style="margin-bottom:12px;">🧑‍💼 DON TITO no tiene computadora. Cuando llegue a comprarte, regístralo aquí.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
        <div class="field"><label>Producto</label>
          <select id="dtProd"><option>Rojo</option><option>Azul</option><option>Rosado</option><option>Blanco</option><option>Amarillo</option></select>
        </div>
        <div class="field"><label>Unidades</label><input type="number" id="dtCant" min="1" value="1"/></div>
        <div class="field" style="display:flex;align-items:flex-end;">
          <button class="btn" style="width:100%;background:#EAF3DE;color:#27500A;border-color:#97C459" onclick="venderDonTito()">Registrar venta a DON TITO</button>
        </div>
      </div>
      <div class="alert-banner" id="dtAlert" style="margin-top:10px;margin-bottom:0"></div>
    </div>
  </div>

  <p class="section-title">Historial de movimientos</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Hora</th><th>Tipo</th><th>Producto</th><th>Cantidad</th><th>Notas</th></tr></thead>
      <tbody id="histBody"><tr><td colspan="6" style="text-align:center;padding:2rem;color:#b4b2a9;">Sin movimientos.</td></tr></tbody>
    </table>
  </div>

</div>
</div>

<div class="orders-panel">
  <p class="section-title">Pedidos recibidos</p>
  <div id="ordersContainer"><p style="font-size:13px;color:#b4b2a9;text-align:center;padding-top:2rem;">Sin pedidos.</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, addDoc, updateDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

const CFG = { apiKey:"AIzaSyBPl8fbal3PwpfZuitFVRDGRwuVmhhA6Ww", authDomain:"cadena-de-suministros-1d554.firebaseapp.com", projectId:"cadena-de-suministros-1d554", storageBucket:"cadena-de-suministros-1d554.firebasestorage.app", messagingSenderId:"154153617557", appId:"1:154153617557:web:0a58532b2008c9d09df39c" };
const app = initializeApp(CFG);
const db = getFirestore(app);

const ID = "YICHANG_CD";
const PRODS = ["Rojo","Azul","Rosado","Blanco","Amarillo"];
const INIT = {Rojo:16,Azul:8,Rosado:16,Blanco:16,Amarillo:40};
const LIMIT = 120;
let stock = {...INIT};
let timers = {};

document.getElementById("connStatus").textContent = "✓ Conectado";

(async()=>{
  const s=await getDoc(doc(db,"stocks",ID));
  if(!s.exists()) await setDoc(doc(db,"stocks",ID),INIT);
  else stock=s.data(); renderStock();
})();

onSnapshot(doc(db,"stocks",ID), s=>{if(s.exists()){stock=s.data();renderStock();}});
onSnapshot(query(collection(db,"movimientos"),where("empresa","==",ID),orderBy("timestamp","desc")), s=>{
  const rows=[]; s.forEach(d=>rows.push({id:d.id,...d.data()})); renderHist(rows);
});
onSnapshot(query(collection(db,"pedidos"),where("destino","==",ID),orderBy("timestamp","desc")), s=>{
  const orders=[]; s.forEach(d=>orders.push({id:d.id,...d.data()})); renderOrders(orders);
});

function renderStock(){
  const total=PRODS.reduce((a,p)=>a+(stock[p]||0),0);
  const pct=Math.min(100,Math.round(total/LIMIT*100));
  const isOver=total>=LIMIT;
  const color=isOver?"#E24B4A":pct>=80?"#EF9F27":"#1D9E75";
  document.getElementById("stockGrid").innerHTML=PRODS.map(p=>{
    const v=stock[p]||0; const s=v===0?"danger":"ok";
    return `<div class="stock-card ${s!=="ok"?s:""}">
      <div class="product-name">${p}</div>
      <div class="stock-num ${s}">${v}</div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.min(100,Math.round(v/LIMIT*100))}%;background:${s==="ok"?"#1D9E75":"#E24B4A"}"></div></div>
    </div>`;
  }).join("");
  document.getElementById("totalBar").innerHTML=`
    <span class="total-bar-label">Stock total</span>
    <div class="total-bar-track"><div class="total-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <span class="total-bar-num" style="color:${color}">${total} / ${LIMIT} uds${isOver?" ⚠ LÍMITE":""}</span>`;
  const b=document.getElementById("alertBanner");
  if(isOver){b.className="alert-banner error show";b.textContent="⚠ Stock total en el límite (120 uds).";}
  else b.className="alert-banner";
}

function renderHist(rows){
  const b=document.getElementById("histBody");
  if(!rows.length){b.innerHTML='<tr><td colspan="6" style="text-align:center;padding:2rem;color:#b4b2a9;">Sin movimientos.</td></tr>';return;}
  const tipos={"orden-compra":"Orden de compra","transf-entrada":"Entrada"};
  b.innerHTML=rows.map((r,i)=>`<tr>
    <td style="color:#b4b2a9">${rows.length-i}</td>
    <td style="color:#888780">${r.timestamp?new Date(r.timestamp.toDate()).toLocaleTimeString("es-PE"):"—"}</td>
    <td><span class="badge ${r.tipo}">${tipos[r.tipo]||r.tipo}</span></td>
    <td>${r.producto}</td>
    <td style="font-weight:500">${r.direccion==="salida"?"-":"+"}${r.cantidad} uds</td>
    <td style="color:#888780;font-size:12px">${r.notas||""}</td></tr>`).join("");
}

function renderOrders(orders){
  const c=document.getElementById("ordersContainer");
  if(!orders.length){c.innerHTML='<p style="font-size:13px;color:#b4b2a9;text-align:center;padding-top:2rem;">Sin pedidos.</p>';return;}
  c.innerHTML=orders.map(o=>{
    const t=o.timestamp?new Date(o.timestamp.toDate()).toLocaleTimeString("es-PE"):"—";
    if(o.estado==="completado"||o.estado==="registrado") return `<div class="order-item ${o.estado}">
      <div class="order-title">${o.producto} — ${o.cantidad} uds</div>
      <div class="order-detail">${t} · <span class="badge ${o.estado}">${o.estado==="completado"?"Completado":"Registrado"}</span></div></div>`;
    if(o.estado==="vencido") return `<div class="order-item vencido">
      <div class="order-title">${o.producto} — ${o.cantidad} uds</div>
      <div class="order-detail"><span class="badge vencido">Vencido</span></div></div>`;
    if(o.estado==="en-proceso"){
      if(!timers[o.id]) startTimer(o.id,o.acceptedAt);
      return `<div class="order-item en-proceso" id="ord-${o.id}">
        <div class="order-title">${o.producto} — ${o.cantidad} uds</div>
        <div class="order-detail"><span class="badge orden-compra">Orden de compra</span></div>
        <div class="timer" id="tmr-${o.id}">3:00</div>
        <button class="btn success" style="width:100%;margin-top:6px" onclick="completar('${o.id}','${o.producto}',${o.cantidad})">Registrar recepción ✓</button>
      </div>`;
    }
    return `<div class="order-item pendiente" id="ord-${o.id}">
      <div class="order-title">${o.producto} — ${o.cantidad} uds</div>
      <div class="order-detail">${t} · <span class="badge orden-compra">Orden de compra</span></div>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn success" style="flex:1" onclick="aceptar('${o.id}')">Aceptar</button>
        <button class="btn danger" style="flex:1" onclick="rechazar('${o.id}')">Rechazar</button>
      </div></div>`;
  }).join("");
}

function startTimer(oid,acceptedAt){
  if(timers[oid]) return;
  const dl=acceptedAt?(acceptedAt.toDate?acceptedAt.toDate().getTime():acceptedAt)+180000:Date.now()+180000;
  timers[oid]=setInterval(async()=>{
    const rem=dl-Date.now(); const el=document.getElementById("tmr-"+oid);
    if(!el){clearInterval(timers[oid]);return;}
    if(rem<=0){
      clearInterval(timers[oid]);el.textContent="¡TIEMPO!";el.className="timer expired";
      await updateDoc(doc(db,"pedidos",oid),{estado:"vencido"});
      await addDoc(collection(db,"penalizaciones"),{empresa:ID,motivo:"Tiempo vencido",detalle:"Pedido no completado en 3 min",timestamp:serverTimestamp()});
      return;
    }
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    el.textContent=`${m}:${s.toString().padStart(2,"0")}`;el.className="timer"+(rem<60000?" warning":"");
  },500);
}

window.aceptar = async id => await updateDoc(doc(db,"pedidos",id),{estado:"en-proceso",acceptedAt:serverTimestamp()});
window.rechazar = async id => await updateDoc(doc(db,"pedidos",id),{estado:"rechazado"});

window.completar = async function(id,producto,cant){
  const total=PRODS.reduce((a,p)=>a+(stock[p]||0),0);
  if(total+cant>LIMIT){
    await addDoc(collection(db,"penalizaciones"),{empresa:ID,motivo:"Stock límite excedido",detalle:`Total superaría ${LIMIT} uds`,timestamp:serverTimestamp()});
  }
  const ns={...stock}; ns[producto]=(ns[producto]||0)+cant;
  await setDoc(doc(db,"stocks",ID),ns);
  await addDoc(collection(db,"movimientos"),{empresa:ID,tipo:"transf-entrada",producto,cantidad:cant,direccion:"entrada",notas:"Recepción de UNILEVER PERÚ",timestamp:serverTimestamp()});
  await updateDoc(doc(db,"pedidos",id),{estado:"completado"});
  clearInterval(timers[id]);
};

window.enviarOC = async function(){
  const prod=document.getElementById("ocProd").value;
  const cajas=parseInt(document.getElementById("ocCant").value);
  const al=document.getElementById("ocAlert");
  if(!cajas||cajas<1) return;
  await addDoc(collection(db,"pedidos"),{destino:"UNILEVER_PERU",tipo:"orden-compra",producto:prod,cantidad:cajas,origen:ID,estado:"pendiente",timestamp:serverTimestamp()});
  await addDoc(collection(db,"movimientos"),{empresa:ID,tipo:"orden-compra",producto:prod,cantidad:cajas,direccion:"salida",notas:"OC enviada a UNILEVER PERÚ",timestamp:serverTimestamp()});
  showAlert(al,`Orden de compra enviada — ${cajas} cj de ${prod}.`,false);
};

window.venderDonTito = async function(){
  const prod=document.getElementById("dtProd").value;
  const cant=parseInt(document.getElementById("dtCant").value);
  const al=document.getElementById("dtAlert");
  if(!cant||cant<1) return;
  if((stock[prod]||0)<cant){showAlert(al,"Stock insuficiente.",true);return;}
  const ns={...stock}; ns[prod]-=cant;
  await setDoc(doc(db,"stocks",ID),ns);
  await addDoc(collection(db,"movimientos"),{empresa:ID,tipo:"orden-compra",producto:prod,cantidad:cant,direccion:"salida",notas:"Venta a DON TITO",timestamp:serverTimestamp()});
  showAlert(al,`Venta registrada — ${cant} uds de ${prod} a DON TITO.`,false);
};

window.switchTab = function(t){
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",["oc","dt"][i]===t));
  document.querySelectorAll(".tab-content").forEach(el=>el.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
};

function showAlert(el,msg,err){el.textContent=msg;el.className="alert-banner show"+(err?" error":"");setTimeout(()=>el.className="alert-banner",4000);}
</script>
</body>
</html>
